<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemistry structure visualization</title>
  <style>
    :root { color-scheme:light; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --accent:#2368f0; --accent-soft:#eef4ff; --line:#e3e7ee; --text:#20242a; --muted:#677386; --subtle:#909aaa; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--text); }
    main { width:min(760px,100%); margin:0 auto; padding:18px; }
    .structure-stage { height:268px; display:grid; place-items:center; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .structure-stage img { width:auto; height:232px; max-width:100%; display:block; object-fit:contain; object-position:center; }
    .selector { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:14px; }
    .tab { min-height:48px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--muted); font:680 10px/1.3 inherit; text-align:left; cursor:pointer; transition:border-color .16s ease,background .16s ease,color .16s ease; }
    .tab:hover { border-color:rgba(35,104,240,.35); }
    .tab.active { border-color:rgba(35,104,240,.5); background:var(--accent-soft); color:var(--accent); }
    .answer { margin-top:12px; padding:14px; border:1px solid var(--line); border-radius:14px; background:#f8fafd; }
    .summary { margin:0; font-size:12px; font-weight:650; line-height:1.5; }
    .facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:11px; }
    .fact { min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:9px; background:#fff; }
    .fact small,.fact strong { display:block; }
    .fact small { margin-bottom:3px; color:var(--subtle); font-size:8px; font-weight:720; letter-spacing:.05em; text-transform:uppercase; }
    .fact strong { overflow-wrap:anywhere; font-size:10px; line-height:1.35; }
    @media (max-width:540px) { main { padding:12px; } .selector { grid-template-columns:1fr; } .facts { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="structure-stage"><img id="structureImage" alt="Tyrosine structure" /></section>
    <div class="selector" role="tablist" aria-label="Chemistry structure examples" id="selector"></div>
    <section class="answer"><p class="summary" id="summary"></p><div class="facts" id="facts"></div></section>
  </main>
  <script>
    const structures = [
      { title:'Tyrosine', summary:'Tyrosine combines a para-hydroxyphenyl side chain with an α-amino acid backbone.', image:'gallery-33-tyrosine.png', facts:[['Molecular formula','C₉H₁₁NO₃'],['Class','Aromatic amino acid'],['Functional groups','Phenol · amine · carboxyl'],['Gallery reference','#33']] },
      { title:'2,3-Diaminopropanoic acid', summary:'A three-carbon amino acid with amino groups on both carbon 2 and carbon 3.', image:'gallery-36-diaminopropanoic-acid.png', facts:[['Molecular formula','C₃H₈N₂O₂'],['Amino groups','2'],['IUPAC name','2,3-diaminopropanoic acid'],['Gallery reference','#36']] },
      { title:'Propionic acid Lewis structure', summary:'The complete Lewis structure shows the CH₃CH₂COOH skeleton and both lone pairs on each oxygen.', image:'gallery-32-propionic-acid-lewis.png', facts:[['Molecular formula','C₃H₆O₂'],['Condensed formula','CH₃CH₂COOH'],['Valence electrons','30'],['Gallery reference','#32']] }
    ];
    const image = document.getElementById('structureImage');
    const selector = document.getElementById('selector');
    const summary = document.getElementById('summary');
    const facts = document.getElementById('facts');
    let lastReportedHeight = 0;
    function reportSize() {
      const height = Math.ceil(Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
      if (height === lastReportedHeight) return;
      lastReportedHeight = height;
      window.parent.postMessage({ type:'solvely-solver-sample-size', height }, '*');
    }
    function render(index) {
      const structure = structures[index];
      image.src = structure.image;
      image.alt = structure.title;
      summary.textContent = structure.summary;
      facts.innerHTML = structure.facts.map(([label,value]) => `<div class="fact"><small>${label}</small><strong>${value}</strong></div>`).join('');
      selector.querySelectorAll('.tab').forEach((tab,tabIndex) => { const active = tabIndex === index; tab.classList.toggle('active',active); tab.setAttribute('aria-selected',String(active)); });
      window.parent.postMessage({ type:'solvely-solver-sample-title', title:structure.title, description:structure.summary }, '*');
      requestAnimationFrame(reportSize);
    }
    selector.innerHTML = structures.map((structure,index) => `<button class="tab" type="button" role="tab" data-index="${index}">${structure.title}</button>`).join('');
    selector.addEventListener('click', event => { const tab = event.target.closest('[data-index]'); if (tab) render(Number(tab.dataset.index)); });
    image.addEventListener('load', reportSize);
    new ResizeObserver(() => requestAnimationFrame(reportSize)).observe(document.body);
    window.addEventListener('resize', reportSize);
    render(0);
    requestAnimationFrame(reportSize);
  </script>
</body>
</html>
