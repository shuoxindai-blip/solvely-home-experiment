<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negative Externality Simulator</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    .slider { -webkit-appearance:none; width:100%; height:5px; border-radius:3px; outline:none; background:linear-gradient(to right,#3b82f6 var(--val,50%),#E0E0E0 var(--val,50%)); margin-top:8px; }
    .slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#FFFFFF; border:2px solid #3b82f6; cursor:pointer; }
    @media (max-height: 500px) { .header-hide { display: none; } }
    body { background: transparent; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app" class="h-screen flex flex-col p-2 gap-2 overflow-hidden">
    <!-- Header -->
    <div class="header-hide text-white p-2 rounded-lg shadow flex justify-between items-center" style="background:rgba(37,99,235,0.9)">
      <h1 class="text-sm font-bold">Negative Externality & Pigouvian Tax</h1>
      <div ref="formulaRef" class="text-xs"></div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col md:flex-row flex-1 gap-2 min-h-0">
      <!-- Viz Area -->
      <div class="flex-1 min-h-0 relative">
        <div ref="plotRef" class="w-full h-full"></div>
      </div>

      <!-- Controls -->
      <div class="md:w-[260px] flex flex-col gap-2 p-3 rounded-2xl bg-white shadow-lg border border-gray-100">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Market Parameters</h2>

        <div v-for="s in sliders" :key="s.id" class="flex flex-col p-2 rounded-lg bg-gray-50 border border-gray-100">
          <div class="flex justify-between text-[10px] font-medium">
            <span class="text-gray-600">{{ s.label }}</span>
            <span class="text-blue-600">{{ s.value }}{{ s.unit }}</span>
          </div>
          <input type="range" :min="s.min" :max="s.max" :step="s.step"
                 v-model.number="s.value" class="slider"
                 :style="{'--val': ((s.value - s.min) / (s.max - s.min) * 100) + '%'}">
        </div>

        <div class="mt-auto p-2 bg-blue-50 rounded-lg border border-blue-100">
          <p class="text-[10px] text-blue-800 leading-tight">
            <b>Pigouvian Tax:</b> Set tax equal to Marginal Damage (MD) at the social optimum to eliminate Deadweight Loss.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, reactive, ref, watch, onMounted } = Vue;

    createApp({
      setup() {
        const plotRef = ref(null);
        const formulaRef = ref(null);

        const sliders = reactive([
          { id: 'md', label: 'Marginal Damage (MD)', value: 12, min: 0, max: 40, step: 1, unit: '$/u' },
          { id: 'tax', label: 'Applied Tax (T)', value: 0, min: 0, max: 40, step: 1, unit: '$/u' },
          { id: 'demand', label: 'Demand Intercept', value: 300, min: 250, max: 350, step: 5, unit: '' }
        ]);

        const updatePlot = () => {
          const md = sliders[0].value;
          const tax = sliders[1].value;
          const dInt = sliders[2].value;

          // Equations based on Example 2 structure
          // PMB: P = dInt - 0.25Q
          // PMC: P = 120 + 0.5Q
          // SMC: P = (120 + md) + 0.5Q
          // Market with Tax: P = (120 + tax) + 0.5Q

          const qMax = 400;
          const qs = [0, qMax];

          const pmb = qs.map(q => dInt - 0.25 * q);
          const pmc = qs.map(q => 120 + 0.5 * q);
          const smc = qs.map(q => (120 + md) + 0.5 * q);
          const pmcTax = qs.map(q => (120 + tax) + 0.5 * q);

          // Intersections
          const qM = (dInt - 120) / 0.75; // Market Q (no tax)
          const qOpt = (dInt - (120 + md)) / 0.75; // Social Opt Q
          const qTax = (dInt - (120 + tax)) / 0.75; // Q with current tax

          const pM = dInt - 0.25 * qM;
          const pOpt = dInt - 0.25 * qOpt;
          const pTax = dInt - 0.25 * qTax;

          // DWL Triangle points
          const dwlX = [qOpt, qTax, qTax, qOpt];
          const dwlY = [
            dInt - 0.25 * qOpt,
            (120 + md) + 0.5 * qTax,
            dInt - 0.25 * qTax,
            dInt - 0.25 * qOpt
          ];

          const traces = [
            { x: qs, y: pmb, name: 'PMB (Demand)', line: { color: '#3b82f6', width: 3 } },
            { x: qs, y: pmc, name: 'PMC (Supply)', line: { color: '#10b981', width: 2 } },
            { x: qs, y: smc, name: 'SMC (PMC+MD)', line: { color: '#ef4444', width: 2, dash: 'dash' } },
            { x: qs, y: pmcTax, name: 'PMC + Tax', line: { color: '#8b5cf6', width: 2 } },
            {
              x: dwlX, y: dwlY, fill: 'toself', fillcolor: 'rgba(239, 68, 68, 0.3)',
              line: { color: 'transparent' }, name: 'Deadweight Loss'
            },
            {
              x: [qTax], y: [pTax], mode: 'markers+text',
              marker: { size: 10, color: '#000' },
              text: [`Q=${qTax.toFixed(0)}`], textposition: 'top right', name: 'Current Equilibrium'
            },
            {
              x: [qOpt], y: [pOpt], mode: 'markers',
              marker: { size: 8, color: '#ef4444', symbol: 'star' },
              name: 'Social Optimum'
            }
          ];

          const layout = {
            autosize: true,
            margin: { l: 40, r: 20, t: 20, b: 80 },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            xaxis: { title: 'Quantity (Q)', range: [150, 300], gridcolor: '#eee' },
            yaxis: { title: 'Price ($)', range: [180, 280], gridcolor: '#eee' },
            legend: { orientation: 'h', y: -0.3, x: 0.5, xanchor: 'center', font: { size: 10 } },
            showlegend: true
          };

          Plotly.react(plotRef.value, traces, layout, { responsive: true, displayModeBar: false });
        };

        watch(sliders, updatePlot, { deep: true });

        onMounted(() => {
          katex.render("SMC = PMC + MD \\quad | \\quad T_{opt} = MD(Q_{opt})", formulaRef.value);
          updatePlot();
          window.addEventListener('resize', () => Plotly.Plots.resize(plotRef.value));
        });

        return { sliders, plotRef, formulaRef };
      }
    }).mount('#app');
  </script>
</body>
</html>
